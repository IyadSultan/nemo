[package]
name = "nemo-realtime-voice"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
sha1 = "0.10"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
getrandom = "0.3"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# The team of helper agents (rust/src/team.rs).
autoagents = "0.4"
autoagents-derive = "0.4"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
portable-pty = "0.9"
# The browser agent talks to Chrome over CDP (rust/src/browser).
tokio-tungstenite = "0.26"

[dev-dependencies]
futures-core = "0.3"
tokio-stream = "0.1"
http-body-util = "0.1"
