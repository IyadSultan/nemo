[package]
name = "second-brain-window"
version = "0.1.0"
edition = "2021"
description = "The second brain in its own window (WebKit, no browser)."

[[bin]]
name = "second-brain"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
muda = "0.17"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSObject", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
] }
