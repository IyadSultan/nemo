<!doctype html>
<!--
  Title card for the movie editor. movies.js renders it with
  hyperframes render --variables '{"title":"…","subtitle":"…","look":"dark"}'
  and adds the mp4 to the movie as a normal clip.
  GSAP is a local copy so a render needs no network.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"My Trip"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":""},
    {"id":"look","type":"enum","label":"Look","default":"dark","options":[{"value":"dark","label":"Dark"},{"value":"light","label":"Light"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0c10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #f2f4f7;
        background: radial-gradient(120% 90% at 50% 40%, #1a2230 0%, #0a0c10 70%);
      }
      #root.light {
        color: #12161d;
        background: radial-gradient(120% 90% at 50% 40%, #ffffff 0%, #e6e9ee 75%);
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      #title {
        max-width: 1600px;
        font-size: 132px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.035em;
        text-align: center;
      }
      #title .word {
        display: inline-block;
        white-space: pre;
      }
      #rule {
        width: 220px;
        height: 6px;
        border-radius: 3px;
        background: #2fc6a0;
        transform-origin: center;
      }
      #subtitle {
        max-width: 1400px;
        font-size: 46px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-align: center;
        opacity: 0.75;
      }
      #subtitle:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <h1 id="title"></h1>
        <div id="rule"></div>
        <p id="subtitle"></p>
      </div>
    </div>
    <script>
      const vars = window.__hyperframes?.getVariables?.() || {};
      const title = String(vars.title || "My Trip");
      const root = document.getElementById("root");
      if (vars.look === "light") root.classList.add("light");
      const heading = document.getElementById("title");
      for (const [i, word] of title.split(/\s+/).entries()) {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = (i ? " " : "") + word;
        heading.append(span);
      }
      document.getElementById("subtitle").textContent = String(vars.subtitle || "");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title .word", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.09 }, 0.2);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.55);
      tl.fromTo("#subtitle", { opacity: 0, y: 24 }, { opacity: 0.75, y: 0, duration: 0.6, ease: "power2.out" }, 0.8);
      tl.to("#title, #rule, #subtitle", { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" }, 3.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
